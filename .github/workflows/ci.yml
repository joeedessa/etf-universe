name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Data files parse and agree
        run: |
          python - <<'EOF'
          import json
          etfs = json.load(open('data/etfs.json'))
          meta = json.load(open('data/meta.json'))
          assert meta['count'] == len(etfs)
          assert len({e['symbol'] for e in etfs}) == len(etfs)
          print(f'OK — {len(etfs)} funds')
          EOF

      - name: Tokyo list is parseable and populated
        run: |
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path('data/tokyo.json')
          if not p.exists():
              print('no tokyo.json yet'); raise SystemExit(0)
          d = json.loads(p.read_text())
          assert d['count'] == len(d['funds']), 'count disagrees with funds'
          assert len(d['funds']) >= 150, f"only {len(d['funds'])} Tokyo funds"
          codes = [f['code'] for f in d['funds']]
          assert len(set(codes)) == len(codes), 'duplicate Tokyo codes'
          assert all(len(c) == 4 and c.isdigit() for c in codes), 'bad code format'
          # The fund-library join: 248/274 when built. A collapse means a name
          # format changed on one side and the match silently degraded.
          lib = [f for f in d['funds'] if f.get('library')]
          assert len(lib) >= 200, f'only {len(lib)} Tokyo funds matched the fund library'
          nopros = [f['code'] for f in lib if not f.get('prospectusUrl')]
          assert not nopros, f'library funds without a prospectus link: {nopros[:5]}'
          noaum = [f['code'] for f in lib if not f.get('netAssets')]
          assert len(noaum) <= 5, f'library funds without net assets: {noaum[:5]}'
          m = json.loads(pathlib.Path('data/tokyo_isin.json').read_text())
          assert len(m) >= 200, f'code->ISIN map has only {len(m)} entries'
          print(f"OK — {len(d['funds'])} Tokyo ETFs, {len(lib)} with library records")
          EOF

      - name: Name classifier behaves on known funds
        run: python scripts/test_derive.py

      - name: Holdings classifier behaves on known funds
        run: python scripts/test_classify.py

      - name: Tokyo PCF row rules behave on known lines
        run: python scripts/test_tokyo_pcf.py

      - name: Tokyo holdings parse and reconcile
        run: |
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path('data/tokyo_holdings.json')
          if not p.exists():
              print('no tokyo_holdings.json yet'); raise SystemExit(0)
          h = json.loads(p.read_text()); f = h['funds']
          assert h['count'] == len(f), 'count disagrees with funds'
          # 241 of 248 library funds when built; a feed that went dark shows here.
          assert len(f) >= 200, f'only {len(f)} Tokyo funds with holdings'
          bad = [c for c, r in f.items() if not r.get('top') or not r.get('asOf') or not r.get('denominatorYen')]
          assert not bad, f'malformed holdings: {bad[:5]}'
          # Weights are computed, not read, so every fund is reconciled against
          # the fund library's net assets. A misread file lands at 0.01x or 100x.
          ok = sum(1 for r in f.values() if r.get('check', {}).get('status') in ('ok', 'approx'))
          assert ok >= 0.85 * len(f), f'only {ok}/{len(f)} reconcile with library net assets'
          pos = list(pathlib.Path('data/tokyo_positions').glob('*.json'))
          assert len(pos) == len(f), f'{len(pos)} position files for {len(f)} funds'
          print(f"OK — {len(f)} Tokyo funds with holdings, {ok} reconciled, {h['check']}")
          EOF

      - name: Enriched fields are present and holdings parse
        run: |
          python - <<'EOF'
          import json, pathlib
          etfs = json.load(open('data/etfs.json')); n = len(etfs)
          fees = sum(1 for e in etfs if e.get('expense') is not None)
          inc = sum(1 for e in etfs if e.get('inception'))
          src = sum(1 for e in etfs if e.get('categorySource') in ('name', 'holdings'))
          assert fees >= 0.75 * n, f'fees on only {fees}/{n}'
          assert inc >= 0.99 * n, f'inception on only {inc}/{n}'
          assert src == n, f'categorySource missing on {n - src}'
          # Prospectus links: every fee should know which filing it came from,
          # and every 1940-Act fund its series id.
          withfee = [e for e in etfs if e.get('expense') is not None]
          adsh = sum(1 for e in withfee if e.get('expenseAdsh'))
          series = sum(1 for e in etfs if e.get('seriesId'))
          assert adsh >= 0.95 * len(withfee), f'accession on only {adsh}/{len(withfee)} fees'
          assert series >= 0.70 * n, f'series id on only {series}/{n}'
          h = json.load(open('data/holdings.json'))
          assert len(h) >= 3000, f'only {len(h)} funds with holdings'
          bad = [s for s, r in h.items() if not r.get('top') or not r.get('asOf')]
          assert not bad, f'malformed holdings: {bad[:5]}'
          pos = list(pathlib.Path('data/positions').glob('*.json'))
          assert len(pos) >= 3000, f'only {len(pos)} position files'
          print(f'OK — fees {fees}, inception {inc}, holdings {len(h)}, positions {len(pos)}')
          EOF

      # The dashboard is one file with no build step, so a syntax error ships
      # straight to production as a blank page.
      - name: Syntax-check dashboard JavaScript
        run: |
          python - <<'EOF'
          import re, subprocess, sys, tempfile, os, pathlib
          # Each page is checked SEPARATELY: both are IIFEs declaring the same
          # top-level names, so concatenating them collides.
          failed = False
          for name in ['index.html', 'portfolio.html', 'tokyo.html']:
              path = pathlib.Path(name)
              if not path.exists():
                  print(f'skip (absent): {name}'); continue
              js = "\n".join(re.findall(r'<script[^>]*>(.*?)</script>',
                                        path.read_text(), re.DOTALL))
              with tempfile.NamedTemporaryFile(suffix='.js', mode='w', delete=False) as fh:
                  fh.write(js); tmp = fh.name
              r = subprocess.run(['node', '--check', tmp], capture_output=True, text=True)
              os.unlink(tmp)
              if r.returncode:
                  print(f'JS syntax error in {name}:\n{r.stderr}', file=sys.stderr)
                  failed = True
              else:
                  print(f'JS syntax OK: {name}')
          sys.exit(1 if failed else 0)
          EOF
