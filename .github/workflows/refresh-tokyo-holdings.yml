name: Refresh Tokyo holdings

# Portfolio composition files are published every business day, but a weekly
# snapshot is what a research tool needs, and each run rewrites ~240 position
# files (a few MB). Weekly keeps the repository's history proportionate;
# Saturday 03:00 UTC is Saturday noon in Tokyo, after Friday's files are up.
on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-tokyo-holdings
  cancel-in-progress: false

jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Row rules still hold
        run: python scripts/test_tokyo_pcf.py

      # Standard library only. The script refuses to write if fewer than 200
      # funds parse or fewer than 85% reconcile with the fund library's net
      # assets, so a broken feed cannot replace a good file with a bad one.
      - name: Pull portfolio composition files
        run: python scripts/fetch_tokyo_holdings.py

      - name: Validate output
        run: |
          python - <<'EOF'
          import json, pathlib
          h = json.loads(pathlib.Path('data/tokyo_holdings.json').read_text()); f = h['funds']
          assert len(f) >= 200, f'only {len(f)} funds'
          for code, r in f.items():
              assert r['top'] and r['asOf'] and r['denominatorYen'], f'{code} malformed'
              assert len(r['top']) <= 10, f'{code} has more than 10 in top'
          ok = sum(1 for r in f.values() if r['check'] and r['check']['status'] in ('ok', 'approx'))
          assert ok >= 0.85 * len(f), f'only {ok}/{len(f)} reconcile'
          pos = list(pathlib.Path('data/tokyo_positions').glob('*.json'))
          assert len(pos) == len(f), f'{len(pos)} position files for {len(f)} funds'
          print(f"OK — {len(f)} funds, {h['check']}")
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No holdings changes — nothing to commit"
          else
            git commit -m "chore: Tokyo holdings refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
